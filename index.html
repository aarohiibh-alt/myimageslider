<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla JS Image Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <!-- TODO: write your own title and intro line -->
        <h1>MY IMAGE SLIDER</h1>
        <p>Click next to switch the landscape images</p>
      </header>

      <!-- Wrapper = the visible "window" (overflow: hidden in CSS) -->
      <section
        class="slider"
        aria-roledescription="carousel"
        aria-label="Photo gallery"
      >
        <!-- Track = the strip of slides that moves with translateX -->
        <div class="slider-track">
          <div class="slide">
            <img src="https://picsum.photos/id/1036/1200/600" alt="TODO: describe photo 1" />
          </div>
          <div class="slide">
            <img src="https://picsum.photos/id/1039/1200/600" alt="TODO: describe photo 2" />
          </div>
          <div class="slide">
            <img src="https://picsum.photos/id/1041/1200/600" alt="TODO: describe photo 3" />
          </div>
          <div class="slide">
            <img src="https://picsum.photos/id/1043/1200/600" alt="TODO: describe photo 4" />
          </div>
          <div class="slide">
            <img src="https://picsum.photos/id/1050/1200/600" alt="TODO: describe photo 5" />
          </div>
        </div>

        <!-- Controls: classes, not IDs, so several sliders can share one page -->
        <button class="slider-btn slider-btn--prev" type="button" aria-label="Previous slide">
          &#8249;
        </button>
        <button class="slider-btn slider-btn--next" type="button" aria-label="Next slide">
          &#8250;
        </button>

        <!-- Empty on purpose: slider.js creates one dot per slide -->
        <div class="slider-dots" role="tablist" aria-label="Choose slide"></div>
      </section>
    </main>

    <script src="slider.js"></script>
  </body>
</html>
